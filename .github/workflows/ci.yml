name: GameBoy CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/build-push-action@v6.19.2
        with:
          context: .
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: gbemu

      - run: docker run --rm gbemu

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3.12.0
      - uses: docker/build-push-action@v6.19.2
        with:
          context: .
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: gbemu-asan
          build-args: ASAN=1
      - run: docker run --rm gbemu-asan
