name: Gameboy tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    - run: clang-format --version
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2.8.2
    - uses: libsdl-org/setup-sdl@main
      with:
        version: 3-latest
        install-linux-dependencies: true
        cmake-arguments: -DSDL_UNIX_CONSOLE_BUILD=ON
    - run: which cbindgen || cargo install cbindgen
    - run: make verify
